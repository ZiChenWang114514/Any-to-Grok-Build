<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Codex Grok Build Session</title>
  <desc id="desc">A technical title composition showing a controlled Grok CLI session moving through invoke, observe, compact, and verify states.</desc>
  <defs>
    <pattern id="session-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1B2430" stroke-width="1"/>
    </pattern>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="24" fill="#080B10"/>
  <rect width="1200" height="400" rx="24" fill="url(#session-grid)" opacity="0.58"/>
  <path d="M0 1H1200" stroke="#263241"/>

  <g transform="translate(64 52)">
    <text x="0" y="0" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="2">CODEX SKILL · LOCAL GROK CLI</text>
    <text x="0" y="80" fill="#F4F4F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="750">Grok Build</text>
    <text x="0" y="142" fill="#F4F4F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="750">Session Control</text>
    <text x="0" y="196" fill="#A9B3C1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">Invoke precisely. Observe real state.</text>
    <text x="0" y="228" fill="#A9B3C1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">Verify the work independently.</text>
    <g transform="translate(0 270)">
      <rect width="164" height="40" rx="20" fill="#102330" stroke="#24506A"/>
      <circle cx="22" cy="20" r="5" fill="#38BDF8"/>
      <text x="38" y="27" fill="#C7EDFF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">exact session</text>
      <rect x="178" width="156" height="40" rx="20" fill="#17230B" stroke="#3F6212"/>
      <circle cx="200" cy="20" r="5" fill="#A3E635"/>
      <text x="216" y="27" fill="#E5FFC0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">real checks</text>
    </g>
  </g>

  <g transform="translate(682 42)">
    <rect width="454" height="316" rx="18" fill="#0D1219" stroke="#344151"/>
    <path d="M0 52H454" stroke="#283544"/>
    <circle cx="24" cy="26" r="5" fill="#64748B"/>
    <circle cx="42" cy="26" r="5" fill="#64748B"/>
    <circle cx="60" cy="26" r="5" fill="#64748B"/>
    <text x="84" y="33" fill="#8794A6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">grok_session.py</text>

    <text x="26" y="92" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">$ invoke --session-id</text>
    <text x="26" y="124" fill="#7C8A9D" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">01a0…8b4f  ·  C:\repo</text>

    <path d="M42 158H384" stroke="url(#trace)" stroke-width="3"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" text-anchor="middle">
      <circle cx="42" cy="158" r="8" fill="#38BDF8"/>
      <text x="42" y="193" fill="#A9B3C1">invoke</text>
      <circle cx="156" cy="158" r="8" fill="#38BDF8"/>
      <text x="156" y="193" fill="#A9B3C1">observe</text>
      <circle cx="270" cy="158" r="8" fill="#FBBF24"/>
      <text x="270" y="193" fill="#A9B3C1">compact</text>
      <circle cx="384" cy="158" r="8" fill="#A3E635"/>
      <text x="384" y="193" fill="#A9B3C1">verify</text>
    </g>

    <rect x="26" y="222" width="402" height="68" rx="12" fill="#111820" stroke="#263442"/>
    <text x="46" y="251" fill="#8794A6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">turn_completed</text>
    <text x="46" y="276" fill="#D8DEE8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">pending_tools: 0</text>
    <rect x="330" y="242" width="76" height="28" rx="14" fill="#253A0E"/>
    <text x="368" y="262" fill="#BEF264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">READY</text>
  </g>
</svg>
