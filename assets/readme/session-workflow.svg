<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Grok session workflow</title>
  <desc id="desc">A four-stage sequence from diagnostics through invocation and observation to independent verification.</desc>
  <rect width="1200" height="390" rx="22" fill="#0A0E14"/>
  <text x="58" y="64" fill="#F4F4F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="40" font-weight="700">One session. Four observable stages.</text>
  <text x="58" y="96" fill="#8794A6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">cwd + session ID + events + repository evidence</text>

  <path d="M166 184H1034" stroke="#2B3948" stroke-width="3"/>
  <path d="M166 184H890" stroke="#38BDF8" stroke-width="3"/>
  <path d="M890 184H1034" stroke="#A3E635" stroke-width="3"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(70 134)">
      <rect width="220" height="190" rx="16" fill="#101720" stroke="#2C3A49"/>
      <circle cx="96" cy="50" r="24" fill="#102F42" stroke="#38BDF8" stroke-width="2"/>
      <text x="96" y="58" fill="#7DD3FC" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">01</text>
      <text x="24" y="104" fill="#F4F4F0" font-size="25" font-weight="650">Diagnose</text>
      <text x="24" y="136" fill="#9AA6B5" font-size="18">CLI · models · doctor</text>
      <text x="24" y="163" fill="#9AA6B5" font-size="18">sessions · active PID</text>
    </g>
    <g transform="translate(350 134)">
      <rect width="220" height="190" rx="16" fill="#101720" stroke="#2C3A49"/>
      <circle cx="110" cy="50" r="24" fill="#102F42" stroke="#38BDF8" stroke-width="2"/>
      <text x="110" y="58" fill="#7DD3FC" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">02</text>
      <text x="24" y="104" fill="#F4F4F0" font-size="25" font-weight="650">Invoke</text>
      <text x="24" y="136" fill="#9AA6B5" font-size="18">exact cwd · prompt</text>
      <text x="24" y="163" fill="#9AA6B5" font-size="18">create or resume</text>
    </g>
    <g transform="translate(630 134)">
      <rect width="220" height="190" rx="16" fill="#101720" stroke="#2C3A49"/>
      <circle cx="110" cy="50" r="24" fill="#102F42" stroke="#38BDF8" stroke-width="2"/>
      <text x="110" y="58" fill="#7DD3FC" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">03</text>
      <text x="24" y="104" fill="#F4F4F0" font-size="25" font-weight="650">Observe</text>
      <text x="24" y="136" fill="#9AA6B5" font-size="18">events · tools · logs</text>
      <text x="24" y="163" fill="#9AA6B5" font-size="18">context · process</text>
    </g>
    <g transform="translate(910 134)">
      <rect width="220" height="190" rx="16" fill="#121A0E" stroke="#45631A"/>
      <circle cx="124" cy="50" r="24" fill="#26390F" stroke="#A3E635" stroke-width="2"/>
      <text x="124" y="58" fill="#BEF264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">04</text>
      <text x="24" y="104" fill="#F4F4F0" font-size="25" font-weight="650">Verify</text>
      <text x="24" y="136" fill="#A6B596" font-size="18">diff · build · tests</text>
      <text x="24" y="163" fill="#A6B596" font-size="18">UI · screenshots</text>
    </g>
  </g>
</svg>
